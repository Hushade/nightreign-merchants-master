<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTREIGN MERCHANTS MASTER</title>
    <!-- Preload the data actually needed for first paint (normal merchants + image map).
         script.js only requests these once it runs (deferred, after DOM parse), so without
         this hint the browser's preload scanner can't discover them until then. -->
    <link rel="preload" href="data/asset-map.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="data/NormalMerchants.csv" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/vendor/papaparse.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <main>
        <div id="loading">データを読み込んでいます...</div>

        <section id="normal-section" class="accordion-section hidden" aria-expanded="true">
            <button class="accordion-header" data-section-id="normal-section" aria-controls="normal-grid">
                <span>通常商人</span>
                <span class="accordion-icon">▼</span>
            </button>
            <div class="accordion-content">
                <div class="content-inner">
                    <div class="grid" id="normal-grid"></div>
                </div>
            </div>
        </section>

        <div id="merchants-container" class="hidden">
            <section id="village-section" class="accordion-section" aria-expanded="false">
                <button class="accordion-header" data-section-id="village-section" aria-controls="village-grid">
                    <span>村の商人</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="content-inner">
                        <div class="grid" id="village-grid"></div>
                    </div>
                </div>
            </section>

            <section id="golden-section" class="accordion-section" aria-expanded="false">
                <button class="accordion-header" data-section-id="golden-section" aria-controls="golden-grid">
                    <span>大空洞のレジェンド武器商人</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="content-inner">
                        <div class="grid" id="golden-grid"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
