<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTREIGN MERCHANTS MASTER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main>
        <div id="loading">データを読み込んでいます...</div>

        <section id="normal-section" class="accordion-section hidden" aria-expanded="true">
            <button class="accordion-header" onclick="toggleAccordion('normal-section')">
                <span>1. 基本商品を選択してください</span>
                <span class="accordion-icon">▼</span>
            </button>
            <div class="accordion-content">
                <div class="content-inner">
                    <div class="grid" id="normal-grid">
                        <!-- JSで動的に追加 -->
                    </div>
                </div>
            </div>
        </section>

        <div id="merchants-container" class="hidden">
            <h2 style="margin: 1.5rem 0 1rem 0; font-size: 1.2rem;">2. 派生商品の確認（選択して展開）</h2>
            
            <section id="village-section" class="accordion-section" aria-expanded="false">
                <button class="accordion-header" onclick="toggleAccordion('village-section')">
                    <span>村の商人</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="content-inner">
                        <div class="grid" id="village-grid"></div>
                    </div>
                </div>
            </section>

            <section id="golden-section" class="accordion-section" aria-expanded="false">
                <button class="accordion-header" onclick="toggleAccordion('golden-section')">
                    <span>大空洞のレジェンド武器商人</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="content-inner">
                        <div class="grid" id="golden-grid"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
